{% extends "base.html" %}
{% block title %}Choose a password · Situation Room{% endblock %}
{% block content %}
<div class="narrow">
<h1>Choose a password</h1>
<p class="context">For {{ person.display_name }} ({{ person.email }}). You will be signed in once it is saved.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/password/{{ token }}" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="email" name="email" value="{{ person.email }}" autocomplete="username" hidden>
  <label>New password <span class="req">at least {{ min_length }} characters</span>
    <input type="password" name="password" required minlength="{{ min_length }}" maxlength="200" autocomplete="new-password"></label>
  <label>New password again
    <input type="password" name="password_again" required minlength="{{ min_length }}" maxlength="200" autocomplete="new-password"></label>
  <button class="primary" type="submit">Save password</button>
</form>
</div>
{% endblock %}
